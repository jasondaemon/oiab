name: oiab

services:
  oiab-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OIAB_CORE_IMAGE:-oiab-core:latest}
    container_name: ${OIAB_CORE_CONTAINER:-oiab-core}
    restart: unless-stopped
    user: "${OIAB_UID:-1000}:${OIAB_GID:-1000}"
    group_add:
      - "${OIAB_DOCKER_GID:-998}"
    environment:
      OIAB_HOSTNAME: ${OIAB_HOSTNAME:-overland.daemonadventures.net}
      OIAB_BIND_HOST: 0.0.0.0
      OIAB_PORT_HTTP: 8080
      OIAB_PORT_HTTPS: ${OIAB_PORT_HTTPS:-8443}
      OIAB_DATA_DIR: /data/oiab
      OIAB_DB_PATH: /data/oiab/db/oiab.sqlite
      OIAB_DEV_MODE: ${OIAB_DEV_MODE:-false}
      OIAB_MAP_PACK_REGISTRY: /data/oiab/maps/registry.json
      OIAB_ENABLE_OPTIONAL_SERVICES: ${OIAB_ENABLE_OPTIONAL_SERVICES:-false}
      OIAB_DEFAULT_MAP_APP: ${OIAB_DEFAULT_MAP_APP:-maps_v2}
      OIAB_CERT_MODE: ${OIAB_CERT_MODE:-existing}
      OIAB_ALLOW_DOCKER_CONTROL: ${OIAB_ALLOW_DOCKER_CONTROL:-false}
      OIAB_ALLOW_HOST_POWER: ${OIAB_ALLOW_HOST_POWER:-true}
      OIAB_HOST_POWER_HELPER_IMAGE: ${OIAB_HOST_POWER_HELPER_IMAGE:-oiab-core:latest}
      OIAB_GPSD_SOCKET: ${OIAB_GPSD_SOCKET:-}
      OIAB_GPSD_HOST: ${OIAB_GPSD_HOST:-host.docker.internal}
      OIAB_GPSD_PORT: ${OIAB_GPSD_PORT:-2947}
      OIAB_EMULATORJS_DIR: /data/oiab/services/emulatorjs/data
      FILEBROWSER_PORT: ${FILEBROWSER_PORT:-8091}
      FILEBROWSER_URL: ${FILEBROWSER_URL:-}
      JELLYFIN_PORT: ${JELLYFIN_PORT:-8096}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      KOMGA_PORT: ${KOMGA_PORT:-25601}
      KOMGA_URL: ${KOMGA_URL:-}
      KOMGA_PROXY_TARGET: ${KOMGA_PROXY_TARGET:-http://host.docker.internal:25601}
      KOMGA_READER_AUTH_HEADER: ${KOMGA_READER_AUTH_HEADER:-}
      KOMGA_READER_AUTH_FILE: /run/oiab/komga-reader-auth.env
      KIWIX_PORT: ${KIWIX_PORT:-8081}
      KIWIX_URL: ${KIWIX_URL:-}
      MINECRAFT_MAP_PORT: ${MINECRAFT_MAP_PORT:-8123}
      MINECRAFT_ADMIN_PORT: ${MINECRAFT_ADMIN_PORT:-8452}
      MINECRAFT_MAP_URL: ${MINECRAFT_MAP_URL:-}
      MINECRAFT_ADMIN_URL: ${MINECRAFT_ADMIN_URL:-}
      OIAB_CRAFTY_DB: /data/oiab/services/crafty/config/db/crafty.sqlite
      OIAB_CRAFTY_SERVER_NAME: ${OIAB_CRAFTY_SERVER_NAME:-Trailer Pi Minecraft}
      OIAB_MINECRAFT_WIKI_DIR: /data/oiab/content/wikis/minecraft
      OIAB_POKEMON_WIKI_DIR: /data/oiab/content/wikis/pokemon
    ports:
      - "${OIAB_HTTP_PUBLISHED_PORT:-80}:8080"
    volumes:
      # Durable OIAB app state lives here. Large media/content can be mounted
      # separately so installs can reuse an existing external SSD layout.
      - "${OIAB_DATA_DIR:-/srv/trailer/data/oiab}:/data/oiab"
      - "${OIAB_MAP_PACKS_DIR:-/srv/trailer/data/oiab/maps/packs}:/data/oiab/maps/packs"
      - "${OIAB_MUSIC_DIR:-/srv/trailer/media/music}:/data/oiab/media/music"
      - "${OIAB_BOOKS_DIR:-/srv/trailer/media/books/Ebooks}:/data/oiab/media/books"
      - "${OIAB_COMICS_DIR:-/srv/trailer/media/books/Comics}:/data/oiab/media/comics"
      - "${OIAB_ZIM_DIR:-/srv/trailer/iiab/zims}:/data/oiab/content/zim"
      - "${OIAB_WIKIS_DIR:-/srv/trailer/wikis}:/data/oiab/content/wikis"
      - "${OIAB_ROMS_DIR:-/srv/trailer/roms}:/data/oiab/games/roms"
      - "${JELLYFIN_CONFIG_DIR:-/srv/trailer/jellyfin/config}:/data/oiab/services/jellyfin/config"
      - "${OIAB_MINECRAFT_DIR:-/srv/trailer/minecraft/server}:/data/oiab/services/minecraft/server"
      - "${OIAB_CRAFTY_CONFIG_DIR:-/srv/trailer/crafty/docker/config}:/data/oiab/services/crafty/config"
      - "${OIAB_GPSD_SOCKET_HOST:-/var/run/gpsd.sock}:${OIAB_GPSD_SOCKET:-/var/run/gpsd.sock}"
      - "${OIAB_DOCKER_SOCKET_HOST:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${KOMGA_READER_AUTH_FILE_HOST:-/dev/null}:/run/oiab/komga-reader-auth.env:ro"
      # Important subpaths under the bind mount:
      #   certs: /data/oiab/certs
      #   PMTiles/map packs: /data/oiab/maps/packs
      #   music/books/comics/ROMs: may be separate external SSD mounts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  oiab-web:
    image: caddy:2-alpine
    profiles: ["static-server", "production"]
    restart: unless-stopped
    depends_on:
      - oiab-core
    ports:
      - "${OIAB_WEB_HTTP_PUBLISHED_PORT:-18080}:80"
    volumes:
      - "./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${OIAB_MAP_PACKS_DIR:-/data/oiab/maps/packs}:/data/oiab/maps/packs:ro"

  jellyfin:
    image: jellyfin/jellyfin:latest
    profiles: ["jellyfin", "media", "optional"]
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - "${JELLYFIN_CONFIG_DIR:-/srv/trailer/jellyfin/config}:/config"
      - "${JELLYFIN_CACHE_DIR:-/srv/trailer/jellyfin/cache}:/cache"
      - "${OIAB_MEDIA_DIR:-/srv/trailer/media}:/media"

  komga:
    image: gotson/komga:latest
    profiles: ["komga", "reading", "optional"]
    restart: unless-stopped
    ports:
      - "${KOMGA_PORT:-25601}:25600"
    environment:
      TZ: "${TZ:-America/New_York}"
      KOMGA_CONFIGDIR: /config
      SERVER_SERVLET_CONTEXT_PATH: "${KOMGA_CONTEXT_PATH:-/books}"
      KOMGA_LIBRARIES_SCAN_CRON: "${KOMGA_LIBRARIES_SCAN_CRON:-0 0 */2 * * *}"
    volumes:
      - "${KOMGA_CONFIG_DIR:-/srv/trailer/komga/config}:/config"
      - "${KOMGA_LIBRARY_DIR:-/srv/trailer/media/books}:/data"

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    profiles: ["kiwix", "wiki", "optional"]
    restart: unless-stopped
    ports:
      - "${KIWIX_PORT:-8081}:8080"
    volumes:
      - "${OIAB_ZIM_DIR:-/data/oiab/content/zim}:/data:ro"
    command: ["--library", "/data/library.xml", "--urlRootLocation=/wiki/"]

  minecraft:
    image: itzg/minecraft-server:latest
    profiles: ["minecraft", "games", "optional"]
    restart: "no"
    ports:
      - "${MINECRAFT_JAVA_PORT:-25565}:25565"
      - "${MINECRAFT_BEDROCK_PORT:-19132}:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: ${MINECRAFT_TYPE:-PAPER}
      MEMORY: ${MINECRAFT_MEMORY:-2G}
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD:-change-me}
    volumes:
      - "${OIAB_MINECRAFT_DIR:-/srv/trailer/minecraft/server}:/data"

  filebrowser:
    image: filebrowser/filebrowser:s6
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8091}:80"
    environment:
      PUID: "${OIAB_UID:-1000}"
      PGID: "${OIAB_GID:-1000}"
      TZ: "${TZ:-America/New_York}"
    command: ["--noauth", "--root", "/srv", "--database", "/database/filebrowser.db", "--address", "0.0.0.0"]
    volumes:
      - "${OIAB_FILEBROWSER_ROOT:-/srv/trailer}:/srv"
      - "${OIAB_FILEBROWSER_DB_DIR:-/srv/trailer/data/oiab/services/filebrowser/database}:/database"
      - "${OIAB_FILEBROWSER_CONFIG_DIR:-/srv/trailer/data/oiab/services/filebrowser/config}:/config"
