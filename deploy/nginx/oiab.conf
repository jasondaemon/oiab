map $arg_v $oiab_pmtiles_cache_control {
    default "public, max-age=31536000, immutable";
    "" "no-cache";
}

server {
    listen 80;
    server_name _;

    location /maps/packs/ {
        alias /data/oiab/maps/packs/;
        types { }
        default_type application/octet-stream;
        gzip off;
        sendfile on;
        etag on;
        if_modified_since exact;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control $oiab_pmtiles_cache_control always;
        try_files $uri =404;
    }

    # Cached album thumbnails are generated by oiab-core into the persistent
    # data volume. Serve them directly so bursts of artwork requests do not
    # contend with backend API/database work.
    location /media/music-art/ {
        alias /data/oiab/media/music-art/;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
        }
        default_type image/jpeg;
        access_log off;
        etag on;
        if_modified_since exact;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://oiab-core:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
