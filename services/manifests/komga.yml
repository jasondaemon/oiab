id: komga
name: Komga
description: Books, comics, PDFs, and graphic novel library server.
category: library
install_default: false
runtime: docker
compose_file: services/compose/komga.yml
compose_profile: komga
compose_service: komga
external_container: trailer-komga
systemd_unit: oiab-komga.service
launcher_url: /apps/komga/
installed_marker: /data/oiab/services/komga
install_command: docker compose --env-file config/oiab.env --profile komga up -d komga
data_path: /data/oiab/services/komga
content_path: /data/oiab/media/books
notes: Uses the existing trailer ebook and comic directories when OIAB_BOOKS_DIR and OIAB_COMICS_DIR point at /srv/trailer/media/books.
ports:
  - 25601
