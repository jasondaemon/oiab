services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    profiles: ["jellyfin", "media", "optional"]
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - "${OIAB_DATA_DIR:-/data/oiab}/services/jellyfin/config:/config"
      - "${OIAB_DATA_DIR:-/data/oiab}/services/jellyfin/cache:/cache"
      - "${OIAB_DATA_DIR:-/data/oiab}/media:/media"
