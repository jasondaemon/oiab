services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    profiles: ["jellyfin", "media", "optional"]
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - "${JELLYFIN_CONFIG_DIR:-/srv/trailer/jellyfin/config}:/config"
      - "${JELLYFIN_CACHE_DIR:-/srv/trailer/jellyfin/cache}:/cache"
      - "${OIAB_MEDIA_DIR:-/srv/trailer/media}:/media"
