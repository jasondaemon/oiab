services:
  komga:
    image: gotson/komga:latest
    profiles: ["komga", "reading", "optional"]
    restart: unless-stopped
    ports:
      - "${KOMGA_PORT:-25601}:25600"
    environment:
      TZ: "${TZ:-America/New_York}"
      KOMGA_CONFIGDIR: /config
      SERVER_SERVLET_CONTEXT_PATH: "${KOMGA_CONTEXT_PATH:-/books}"
      KOMGA_LIBRARIES_SCAN_CRON: "${KOMGA_LIBRARIES_SCAN_CRON:-0 0 */2 * * *}"
    volumes:
      - "${KOMGA_CONFIG_DIR:-/srv/trailer/komga/config}:/config"
      - "${KOMGA_LIBRARY_DIR:-/srv/trailer/media/books}:/data"
