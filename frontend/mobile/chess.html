<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123822">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IIAB Overland">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chess | IIAB Overland</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/mobile/overland-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/mobile/overland-icon-192.png">
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="stylesheet" href="/mobile/vendor/chessboardjs/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="chess.css?v=chess-layout-20260606">
</head>
<body data-require-server-player="true">
  <main class="ch-shell">
    <header class="ch-header">
      <a class="icon-button" href="/mobile/" aria-label="Back to mobile launcher">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 5.2 8 12l6.8 6.8-1.8 1.8L5.4 13a1.4 1.4 0 0 1 0-2L13 3.4l1.8 1.8z"></path></svg>
      </a>
      <h1>Chess</h1>
      <button id="settingsToggle" class="icon-button" type="button" aria-label="Chess settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13.5c.1-.5.1-1 .1-1.5s0-1-.1-1.5l2-1.5-2-3.5-2.4 1a8 8 0 0 0-2.6-1.5L14 2h-4l-.4 2.5A8 8 0 0 0 7 6L4.6 5 2.6 8.5l2 1.5a9 9 0 0 0 0 3l-2 1.5 2 3.5L7 17a8 8 0 0 0 2.6 1.5L10 21h4l.4-2.5A8 8 0 0 0 17 17l2.4 1 2-3.5-2-1.5ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"></path></svg>
      </button>
    </header>

    <section id="settingsPanel" class="panel settings-panel" hidden>
      <label>
        Board theme
        <select id="boardTheme">
          <option value="classic">Classic Wood</option>
          <option value="dark">Dark Tactical</option>
          <option value="desert">Desert Map</option>
          <option value="contrast">High Contrast</option>
        </select>
      </label>
    </section>

    <section id="lobby" class="panel">
      <div class="profile-chip">Playing as <strong id="playerNameLabel">Player</strong></div>
      <div class="mode-grid" role="group" aria-label="Game mode">
        <label class="mode-choice">
          <input type="radio" name="gameMode" value="pvp" checked>
          <span>Two Player</span>
        </label>
        <label class="mode-choice">
          <input type="radio" name="gameMode" value="cpu">
          <span>Vs Computer</span>
        </label>
      </div>
      <label id="difficultyLabel" class="difficulty-label" hidden>
        Computer Difficulty
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <div class="actions">
        <button id="createGame" type="button" class="primary">Create Game</button>
      </div>
      <h2>Open / Saved Chess Games</h2>
      <div id="openGames" class="open-games"></div>
    </section>

    <section id="gamePanel" class="panel game-panel" hidden>
      <div class="status-row">
        <div>
          <span id="gameState">Waiting</span>
          <strong id="gameStatus">Create or join a game.</strong>
        </div>
        <button id="leaveGame" class="small-pill" type="button">Leave</button>
      </div>
      <div id="players" class="players"></div>
      <div class="ch-play-area">
        <div id="board" class="ch-board" aria-label="Chess board"></div>
      </div>
      <div class="ch-toolbar">
        <button id="refreshGame" type="button">Refresh</button>
        <button id="flipBoard" type="button">Flip</button>
        <button id="undoMove" type="button">Undo</button>
        <button id="redoMove" type="button">Redo</button>
        <button id="copyFen" type="button">Copy FEN</button>
        <button id="copyPgn" type="button">Copy PGN</button>
      </div>
      <section class="captured-card">
        <h3>Captured</h3>
        <div id="capturedWhite" class="captured"></div>
        <div id="capturedBlack" class="captured"></div>
      </section>
      <details class="move-panel">
        <summary>
          <span>Move history</span>
          <strong id="moveCount">0 moves</strong>
        </summary>
        <ol id="moveHistory" class="move-history"></ol>
      </details>
      <div class="actions">
        <button id="resetGame" type="button">New Board</button>
        <button id="closeGame" type="button" class="danger">Close Game</button>
      </div>
    </section>

    <p id="message" class="message" role="status"></p>
  </main>
  <dialog id="promotionDialog" class="promotion-dialog">
    <form method="dialog">
      <h2>Promote pawn</h2>
      <div class="promotion-options">
        <button value="q">Queen</button>
        <button value="r">Rook</button>
        <button value="b">Bishop</button>
        <button value="n">Knight</button>
      </div>
    </form>
  </dialog>
  <script src="/mobile/vendor/jquery/jquery-3.7.1.min.js"></script>
  <script src="/mobile/vendor/chessboardjs/chessboard-1.0.0.min.js"></script>
  <script src="/mobile/server-player.js?v=20260609"></script>
  <script type="module" src="chess.js?v=chess-ai-20260606"></script>
</body>
</html>
