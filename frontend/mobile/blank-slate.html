<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123822">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IIAB Overland">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Blank Slate | IIAB Overland</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/mobile/overland-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/mobile/overland-icon-192.png">
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="stylesheet" href="blank-slate.css">
</head>
<body data-require-server-player="true">
  <main class="bs-shell">
    <header class="bs-header">
      <a class="icon-button" href="/mobile/" aria-label="Back to mobile launcher">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 5.2 8 12l6.8 6.8-1.8 1.8L5.4 13a1.4 1.4 0 0 1 0-2L13 3.4l1.8 1.8z"></path></svg>
      </a>
      <h1>Blank Slate</h1>
      <button id="refreshGame" class="icon-button" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 0 0 4.3 10H2l3.6 4.1L9.2 10H6.4a6 6 0 0 1 10.2-2.2 6 6 0 0 1 .1 8.4 5.9 5.9 0 0 1-4.2 1.8 6 6 0 0 1-4.4-2l-1.5 1.4A8 8 0 1 0 17.7 6.3z"></path></svg>
      </button>
    </header>

    <section id="lobby" class="panel">
      <div class="profile-chip">Playing as <strong id="playerNameLabel">Player</strong></div>
      <p class="rule-note">3 to 8 players. Match exactly one other player for 3 points. Match a crowd for 1 point. First to 25 wins.</p>
      <div class="actions">
        <button id="createGame" type="button" class="primary">Create Game</button>
      </div>
      <h2>Open Blank Slate Games</h2>
      <div id="openGames" class="open-games"></div>
    </section>

    <section id="gamePanel" class="panel game-panel" hidden>
      <div class="status-row">
        <div>
          <span id="gameState">Waiting</span>
          <strong id="gameStatus">Waiting for players.</strong>
        </div>
        <button id="leaveGame" class="small-pill" type="button">Leave</button>
      </div>

      <div id="players" class="players"></div>

      <section class="cue-card" aria-label="Word cue">
        <span id="roundLabel">Round 1</span>
        <strong id="cueText">____</strong>
      </section>

      <section id="answerPanel" class="answer-panel">
        <label>
          Your word or short phrase
          <input id="answerInput" type="text" autocomplete="off" maxlength="40" placeholder="Type your answer">
        </label>
        <button id="lockAnswer" class="primary" type="button">Lock In</button>
      </section>

      <section id="revealPanel" class="reveal-panel" hidden>
        <div id="answersList" class="answers-list"></div>
        <button id="nextRound" class="primary" type="button">Next Round</button>
      </section>

      <div class="actions">
        <button id="resetGame" type="button">Reset Game</button>
        <button id="closeGame" type="button" class="danger">Close Game</button>
      </div>
    </section>

    <p id="message" class="message" role="status"></p>
  </main>
  <script src="/mobile/server-player.js?v=20260609"></script>
  <script src="blank-slate.js"></script>
</body>
</html>
