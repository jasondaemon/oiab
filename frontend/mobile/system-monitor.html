<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Performance Monitor | OIAB</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07100c;
      --panel: rgba(11, 22, 17, .9);
      --panel2: rgba(24, 40, 31, .86);
      --line: rgba(189, 232, 195, .22);
      --text: #f6f8ef;
      --muted: #aebcaf;
      --green: #80f08a;
      --amber: #ffd04d;
      --red: #ff6d5f;
      --blue: #6bd8ff;
      --card: clamp(170px, 15.6vw, 224px);
      font-family: "Avenir Next", "Trebuchet MS", Verdana, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: auto;
      color: var(--text);
      background:
        radial-gradient(ellipse at 55% -12%, rgba(255, 208, 77, .14), transparent 36rem),
        linear-gradient(115deg, transparent 0 44%, rgba(255,255,255,.03) 44.2% 44.8%, transparent 45% 100%),
        linear-gradient(245deg, transparent 0 46%, rgba(255,255,255,.024) 46.2% 46.8%, transparent 47% 100%),
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 18% 8%, rgba(141, 242, 141, .16), transparent 28rem),
        linear-gradient(135deg, #080d0a, #172218 52%, #0a1114);
      background-size: auto, auto, auto, 42px 42px, 42px 42px, auto, auto;
    }
    .dash {
      min-height: 100dvh;
      padding: clamp(12px, 1.4vw, 22px);
    }
    .cluster {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--card), var(--card)));
      gap: clamp(10px, 1.1vw, 16px);
      align-items: start;
    }
    #disks, #batteryCards { display: contents; }
    .card, .dial, .panel, .fuel-card, .clock-card {
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 34%),
        linear-gradient(180deg, var(--panel2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
      backdrop-filter: blur(18px) saturate(1.08);
    }
    .square {
      width: var(--card);
      height: var(--card);
    }
    .dial {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 18px;
      aspect-ratio: 1;
    }
    .dial::before {
      position: absolute;
      inset: 9%;
      content: "";
      border-radius: 50%;
      background:
        repeating-conic-gradient(from -135deg, rgba(255,255,255,.62) 0deg 1.2deg, transparent 1.2deg 6deg),
        conic-gradient(from -135deg, var(--dial-color, var(--green)) calc(var(--pct, 0) * 2.7deg), rgba(255,255,255,.1) 0 270deg, transparent 0);
      -webkit-mask: radial-gradient(circle, transparent 57%, #000 58%);
      mask: radial-gradient(circle, transparent 57%, #000 58%);
    }
    .dial.temp::before {
      background:
        repeating-conic-gradient(from -135deg, rgba(255,255,255,.62) 0deg 1.2deg, transparent 1.2deg 6deg),
        conic-gradient(from -135deg, var(--green) 0 112deg, var(--amber) 112deg 206deg, var(--red) 206deg 270deg, transparent 0);
      -webkit-mask: radial-gradient(circle, transparent 57%, #000 58%);
      mask: radial-gradient(circle, transparent 57%, #000 58%);
    }
    .dial::after {
      position: absolute;
      inset: 19%;
      content: "";
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 50%;
      background: rgba(3, 9, 7, .62);
      box-shadow: inset 0 0 34px rgba(0,0,0,.55);
    }
    .needle {
      position: absolute;
      z-index: 4;
      bottom: 50%;
      left: 50%;
      width: 3px;
      height: 34%;
      transform: rotate(calc(-135deg + (var(--pct, 0) * 2.7deg)));
      transform-origin: 50% 100%;
      background: linear-gradient(var(--amber), rgba(255,208,77,.12));
      box-shadow: 0 0 16px rgba(255,208,77,.45);
    }
    .needle::after {
      position: absolute;
      bottom: -9px;
      left: 50%;
      width: 18px;
      height: 18px;
      content: "";
      border: 3px solid rgba(8,14,12,.96);
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--amber);
    }
    .dial-face {
      position: relative;
      z-index: 5;
      text-align: center;
      transform: translateY(-7%);
    }
    .dial-value {
      display: inline-block;
      min-width: 4.1em;
      padding: .22em .3em .15em;
      color: #f9fff5;
      background:
        repeating-linear-gradient(0deg, rgba(128,240,138,.08) 0 1px, transparent 1px 4px),
        linear-gradient(180deg, rgba(20, 37, 28, .96), rgba(2, 8, 6, .94));
      border: 1px solid rgba(128, 240, 138, .26);
      border-radius: .24em;
      box-shadow: inset 0 0 18px rgba(0,0,0,.74), 0 0 18px rgba(128,240,138,.12);
      font-family: "DIN Alternate", "Avenir Next Condensed", "Arial Narrow", monospace;
      font-size: clamp(1rem, 1.45vw, 1.38rem);
      font-weight: 1000;
      line-height: .9;
      letter-spacing: .01em;
      text-shadow: 0 0 9px rgba(128,240,138,.22);
    }
    .dial-unit { margin-left: .05em; color: var(--muted); font-size: .48em; }
    .dial.network .dial-unit {
      display: block;
      margin: .25em 0 0;
      font-size: .36em;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .dial-label {
      margin-top: 16px;
      color: var(--muted);
      font-size: clamp(.68rem, .92vw, .86rem);
      font-weight: 950;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .fuel-card {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 14px;
      overflow: hidden;
    }
    .fuel-meter {
      position: relative;
      width: 54px;
      height: 104px;
      margin: 0 auto;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background:
        repeating-linear-gradient(to top, transparent 0 9px, rgba(3,9,7,.96) 9px 13px),
        linear-gradient(to top, var(--red) 0 18%, var(--amber) 18% 34%, var(--green) 34% 100%);
      box-shadow: inset 0 0 18px rgba(0,0,0,.7), 0 0 26px rgba(128,240,138,.1);
    }
    .fuel-meter::before {
      position: absolute;
      inset: 0 0 auto;
      height: calc(var(--empty, 0) * 1%);
      content: "";
      background: rgba(2,8,6,.86);
    }
    .fuel-meter::after {
      position: absolute;
      inset: 10px;
      content: "";
      border: 1px solid rgba(255,255,255,.08);
      border-radius: inherit;
    }
    .fuel-card h3 {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: .66rem;
      line-height: 1.05;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .fuel-value {
      margin: 0 0 4px;
      font-family: "DIN Alternate", "Avenir Next Condensed", "Arial Narrow", monospace;
      font-size: clamp(1.25rem, 1.85vw, 1.72rem);
      font-weight: 1000;
      line-height: .9;
      letter-spacing: -.03em;
    }
    .small { color: var(--muted); font-size: .68rem; line-height: 1.15; overflow-wrap: anywhere; }
    code { color: var(--blue); }
    .clock-card {
      display: grid;
      align-content: center;
      padding: 18px;
      overflow: hidden;
    }
    .clock-card::before {
      width: 100%;
      height: 8px;
      margin-bottom: 14px;
      content: "";
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, var(--green) 0 9px, transparent 9px 16px);
      opacity: .76;
      box-shadow: 0 0 20px rgba(128,240,138,.22);
    }
    .clock-date {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .clock-time {
      margin-top: 8px;
      font-family: "DIN Alternate", "Avenir Next Condensed", "Arial Narrow", monospace;
      font-size: clamp(1.45rem, 2.2vw, 2.1rem);
      font-weight: 1000;
      line-height: .9;
      white-space: nowrap;
      text-shadow: 0 0 24px rgba(255,208,77,.18);
    }
    .clock-zone {
      margin-top: 10px;
      color: var(--amber);
      font-size: .68rem;
      font-weight: 950;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .panel {
      margin-top: 14px;
      padding: 16px;
    }
    .panel h2 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .86rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .service-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 48px;
      padding: 11px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 16px;
    }
    .row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 18px rgba(255,109,95,.7);
    }
    .dot.active {
      background: var(--green);
      box-shadow: 0 0 18px rgba(128,240,138,.7);
    }
    @media (max-width: 780px) {
      :root { --card: min(44vw, 190px); }
      .cluster { grid-template-columns: repeat(2, minmax(0, var(--card))); justify-content: center; }
      .fuel-card { grid-template-columns: 50px minmax(0, 1fr); }
      .fuel-meter { width: 46px; height: 92px; }
    }
  </style>
</head>
<body>
  <main class="dash" aria-label="Performance monitor">
    <section class="cluster">
      <article id="cpuGauge" class="dial square"><i class="needle" aria-hidden="true"></i><div class="dial-face"><div class="dial-value"><span id="cpuValue">--</span><span class="dial-unit">%</span></div><div class="dial-label">CPU Load</div></div></article>
      <article id="loadGauge" class="dial square"><i class="needle" aria-hidden="true"></i><div class="dial-face"><div class="dial-value"><span id="loadValue">--</span><span class="dial-unit">x</span></div><div class="dial-label">Load RPM</div></div></article>
      <article id="memGauge" class="dial square"><i class="needle" aria-hidden="true"></i><div class="dial-face"><div class="dial-value"><span id="memValue">--</span><span class="dial-unit">%</span></div><div class="dial-label">Memory</div></div></article>
      <article id="tempGauge" class="dial temp square"><i class="needle" aria-hidden="true"></i><div class="dial-face"><div class="dial-value"><span id="tempValue">--</span><span class="dial-unit">F</span></div><div class="dial-label">Temp</div></div></article>
      <article id="netInGauge" class="dial network square"><i class="needle" aria-hidden="true"></i><div class="dial-face"><div class="dial-value"><span id="netInValue">--</span><span class="dial-unit">Kbps</span></div><div class="dial-label">Net In</div></div></article>
      <article id="netOutGauge" class="dial network square"><i class="needle" aria-hidden="true"></i><div class="dial-face"><div class="dial-value"><span id="netOutValue">--</span><span class="dial-unit">Kbps</span></div><div class="dial-label">Net Out</div></div></article>
      <div id="disks" class="cluster"></div>
      <div id="batteryCards" class="cluster"></div>
      <article class="clock-card square" aria-label="Clock">
        <div id="clockDate" class="clock-date">---</div>
        <div id="clockValue" class="clock-time">--:--</div>
        <div id="clockZone" class="clock-zone">Local</div>
      </article>
    </section>
    <section class="panel">
      <h2>Service Status</h2>
      <div id="services" class="service-list"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const gb = (bytes) => `${(Number(bytes || 0) / 1024 / 1024 / 1024).toFixed(1)} GB`;
    const pct = (value) => Math.max(0, Math.min(100, Number(value) || 0));
    const gaugeColor = (value) => value >= 85 ? "var(--red)" : value >= 68 ? "var(--amber)" : "var(--green)";
    const networkGaugeMaxKbps = 10000;
    let previousNetwork = null;

    function setGauge(id, value, color = null) {
      const safe = pct(value);
      const el = $(id);
      el.style.setProperty("--pct", safe);
      el.style.setProperty("--dial-color", color || gaugeColor(safe));
    }

    function updateClock(timestamp) {
      const date = timestamp ? new Date(timestamp) : new Date();
      $("clockValue").textContent = date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      $("clockDate").textContent = date.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
      $("clockZone").textContent = date.toLocaleTimeString([], { timeZoneName: "short" }).split(" ").pop() || "Local";
    }

    function fuelCard(disk, index) {
      const used = pct(disk.percent);
      const empty = 100 - used;
      const label = disk.label || (index === 0 || disk.path === "/" ? "System SD" : "SSD Data");
      return `<article class="fuel-card square"><div class="fuel-meter" style="--empty:${empty}"></div><div><h3>${label}</h3><div class="fuel-value">${used.toFixed(0)}%</div><div class="small"><strong><code>${disk.path}</code></strong><br>${gb(disk.used)} / ${gb(disk.total)} used<br>${gb(disk.free)} free</div></div></article>`;
    }

    function batteryLevelCard(battery) {
      if (!battery?.available) {
        return `<article class="fuel-card square"><div class="fuel-meter" style="--empty:100"></div><div><h3>Battery</h3><div class="fuel-value">--</div><div class="small">UPS not detected<br>${battery?.error || "Battery unavailable"}</div></div></article>`;
      }
      const level = pct(battery.percentage);
      const empty = 100 - level;
      const voltage = Number(battery.voltage || 0);
      return `<article class="fuel-card square"><div class="fuel-meter" style="--empty:${empty}"></div><div><h3>Battery</h3><div class="fuel-value">${level.toFixed(0)}%</div><div class="small">${voltage ? `${voltage.toFixed(2)}V cell` : "Voltage unavailable"}<br>X1206 UPS</div></div></article>`;
    }

    function batteryPowerCard(battery) {
      const label = battery?.available ? (battery.label || "Battery available") : "Unknown";
      const subtext = battery?.available ? "X1206 UPS" : "UPS not detected";
      return `<article class="fuel-card square"><div class="fuel-meter" style="--empty:${battery?.available ? 12 : 100}"></div><div><h3>Power</h3><div class="fuel-value">${label}</div><div class="small">${subtext}<br>${battery?.chargingStatus || battery?.error || "Unavailable"}</div></div></article>`;
    }

    function formatKbps(value) {
      const safe = Math.max(0, Number(value) || 0);
      if (safe >= 1000) return safe.toFixed(0);
      if (safe >= 100) return safe.toFixed(0);
      if (safe >= 10) return safe.toFixed(1);
      return safe.toFixed(2);
    }

    function networkRates(network, timestamp) {
      const now = timestamp ? new Date(timestamp).getTime() : Date.now();
      const rx = Number(network?.rx_bytes || 0);
      const tx = Number(network?.tx_bytes || 0);
      if (!previousNetwork || now <= previousNetwork.time || rx < previousNetwork.rx || tx < previousNetwork.tx) {
        previousNetwork = { time: now, rx, tx };
        return { inKbps: 0, outKbps: 0 };
      }
      const elapsed = Math.max(0.001, (now - previousNetwork.time) / 1000);
      const inKbps = ((rx - previousNetwork.rx) * 8) / elapsed / 1000;
      const outKbps = ((tx - previousNetwork.tx) * 8) / elapsed / 1000;
      previousNetwork = { time: now, rx, tx };
      return { inKbps, outKbps };
    }

    function render(data) {
      const loads = Array.isArray(data.load) ? data.load : [0, 0, 0];
      const load1 = Number(loads[0] || 0);
      const cores = Number(data.cpu_count || 4);
      const cpuLoad = Math.min(100, (load1 / Math.max(1, cores)) * 100);
      const memory = data.memory || {};
      const tempF = Number(data.temperature_f || 0);
      const tempPct = tempF ? Math.max(0, Math.min(100, ((tempF - 95) / 70) * 100)) : 0;
      const net = networkRates(data.network || {}, data.timestamp);
      const netInPct = Math.min(100, (net.inKbps / networkGaugeMaxKbps) * 100);
      const netOutPct = Math.min(100, (net.outKbps / networkGaugeMaxKbps) * 100);

      $("cpuValue").textContent = cpuLoad.toFixed(1);
      $("loadValue").textContent = load1.toFixed(2);
      $("memValue").textContent = Number(memory.percent || 0).toFixed(1);
      $("tempValue").textContent = tempF ? tempF.toFixed(1) : "--";
      $("netInValue").textContent = formatKbps(net.inKbps);
      $("netOutValue").textContent = formatKbps(net.outKbps);

      setGauge("cpuGauge", cpuLoad);
      setGauge("loadGauge", Math.min(100, load1 * 35));
      setGauge("memGauge", memory.percent || 0);
      setGauge("tempGauge", tempPct, tempF >= 172 ? "var(--red)" : tempF >= 154 ? "var(--amber)" : "var(--green)");
      setGauge("netInGauge", netInPct, "var(--blue)");
      setGauge("netOutGauge", netOutPct, "var(--blue)");
      updateClock(data.timestamp);

      $("disks").innerHTML = (data.disks || []).slice(0, 3).map(fuelCard).join("");
      $("batteryCards").innerHTML = `${batteryLevelCard(data.battery || {})}${batteryPowerCard(data.battery || {})}`;
      $("services").innerHTML = (data.services || []).map((service) => {
        const active = Boolean(service.running || service.enabled);
        return `<div class="row"><i class="dot ${active ? "active" : ""}"></i><strong title="${service.name || service.id}">${service.name || service.id}</strong></div>`;
      }).join("") || `<div class="row"><i class="dot"></i><strong>No service manifests</strong></div>`;
    }

    async function refresh() {
      try {
        const response = await fetch("/api/system/status", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        $("services").innerHTML = `<div class="row"><i class="dot"></i><strong>${error.message}</strong></div>`;
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
