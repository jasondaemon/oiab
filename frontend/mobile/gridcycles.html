<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06130c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OIAB">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GridCycles | OIAB</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/mobile/overland-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/mobile/overland-icon-192.png">
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="stylesheet" href="oiab-arcade.css?v=20260612">
  <link rel="stylesheet" href="gridcycles.css?v=20260613b">
</head>
<body data-require-server-player="true">
  <main class="arcade-shell gridcycles-shell">
    <section class="arcade-stage">
      <canvas id="gridCanvas" aria-label="GridCycles arena"></canvas>
    </section>

    <section class="arcade-hud gridcycles-hud" aria-live="polite">
      <div><span>Round</span><strong id="roundLabel">1</strong></div>
      <div><span>Status</span><strong id="statusLabel">Lobby</strong></div>
      <div><span>Score</span><strong id="scoreLabel">0</strong></div>
    </section>

    <nav class="arcade-actions">
      <a class="arcade-icon" href="/mobile/" aria-label="Back">‹</a>
      <button id="refreshGame" class="arcade-icon" type="button" aria-label="Refresh">↻</button>
    </nav>

    <div id="countdown" class="gridcycles-countdown" hidden>3</div>

    <section id="lobbyPanel" class="arcade-panel gridcycles-panel">
      <p class="eyebrow">OIAB Arcade</p>
      <h1>GridCycles</h1>
      <p class="subtitle">Race on the grid, leave a permanent trail, and be the last cycle still moving.</p>
      <div class="gridcycles-player-chip">Playing as <strong id="playerNameLabel">Player</strong></div>
      <div class="gridcycles-fields">
        <label class="arcade-field">
          Mode
          <select id="gameMode">
            <option value="classic">Classic</option>
            <option value="timed">Timed Survival</option>
            <option value="kid">Kid Mode</option>
          </select>
        </label>
        <label class="arcade-field">
          Difficulty
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Normal</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
          </select>
        </label>
        <label class="arcade-field">
          Rounds
          <select id="roundsToWin">
            <option value="1">1</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
            <option value="7">7</option>
          </select>
        </label>
        <label class="arcade-field">
          Time
          <select id="duration">
            <option value="60">60 sec</option>
            <option value="90" selected>90 sec</option>
            <option value="120">120 sec</option>
          </select>
        </label>
      </div>
      <div class="arcade-menu">
        <button id="soloGame" class="primary" type="button">Solo vs Bots</button>
        <button id="createGame" type="button">Create Room</button>
      </div>
      <h2 class="gridcycles-subhead">Open Rooms</h2>
      <div id="openGames" class="gridcycles-open-games"></div>
    </section>

    <section id="roomPanel" class="arcade-panel gridcycles-panel gridcycles-room" hidden>
      <p class="eyebrow">Room <span id="roomCode">—</span></p>
      <h2 id="roomTitle">Ready?</h2>
      <p id="roomStatus" class="subtitle">Waiting for players.</p>
      <div id="playersList" class="gridcycles-players"></div>
      <div class="arcade-menu">
        <button id="startGame" class="primary" type="button">Start</button>
        <button id="addBot" type="button">Add Bot</button>
        <button id="nextRound" type="button" hidden>Next Round</button>
        <button id="resetGame" type="button">Reset</button>
        <button id="closeGame" class="danger" type="button">Close</button>
      </div>
      <p class="gridcycles-help">Swipe anywhere on the arena, use WASD/arrow keys, or tap the direction pad.</p>
    </section>

    <section id="dpad" class="gridcycles-dpad" aria-label="Direction controls">
      <button data-dir="up" type="button">▲</button>
      <button data-dir="left" type="button">◀</button>
      <button data-dir="right" type="button">▶</button>
      <button data-dir="down" type="button">▼</button>
    </section>

    <p id="message" class="arcade-message" role="status" hidden></p>
  </main>
  <script src="/mobile/server-player.js?v=20260609"></script>
  <script src="gridcycles.js?v=20260613b"></script>
</body>
</html>
