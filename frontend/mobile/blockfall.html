<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123822">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IIAB Overland">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Blockfall Battle | IIAB Overland</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/mobile/overland-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/mobile/overland-icon-192.png">
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="stylesheet" href="blockfall.css">
</head>
<body>
  <main class="bf-shell">
    <header class="bf-header">
      <a class="icon-button" href="/mobile/" aria-label="Back to mobile launcher">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 5.2 8 12l6.8 6.8-1.8 1.8L5.4 13a1.4 1.4 0 0 1 0-2L13 3.4l1.8 1.8z"></path></svg>
      </a>
      <h1>Blockfall Battle</h1>
      <button id="refreshGame" class="icon-button" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 0 0 4.3 10H2l3.6 4.1L9.2 10H6.4a6 6 0 0 1 10.2-2.2 6 6 0 0 1 .1 8.4 5.9 5.9 0 0 1-4.2 1.8 6 6 0 0 1-4.4-2l-1.5 1.4A8 8 0 1 0 17.7 6.3z"></path></svg>
      </button>
    </header>

    <section id="lobby" class="panel lobby">
      <div class="profile-chip">Playing as <strong id="playerNameLabel">Player</strong></div>
      <div class="mode-grid" role="group" aria-label="Game mode">
        <button data-mode="endless" type="button" class="mode-card primary">Solo Endless</button>
        <button data-mode="timed" type="button" class="mode-card">Solo Timed</button>
        <button data-mode="battle" type="button" class="mode-card">Battle Mode</button>
        <button data-mode="timed-battle" type="button" class="mode-card">Timed Battle</button>
      </div>
      <label id="durationWrap" class="duration-label" hidden>
        Duration
        <select id="duration">
          <option value="60">1 minute</option>
          <option value="120" selected>2 minutes</option>
          <option value="180">3 minutes</option>
          <option value="300">5 minutes</option>
        </select>
      </label>
      <label class="audio-label">
        Music
        <select id="musicSelect">
          <option value="">None</option>
          <option value="music1">Music 1</option>
          <option value="music2">Music 2</option>
          <option value="music3">Music 3</option>
          <option value="adventure">Adventure</option>
          <option value="casey">Casey</option>
          <option value="midnight">Midnight Run</option>
          <option value="grid">The Grid</option>
        </select>
      </label>
      <div class="actions">
        <button id="startMode" type="button" class="primary">Start Solo Endless</button>
      </div>
      <h2>Open Blockfall Battles</h2>
      <div id="openGames" class="open-games"></div>
    </section>

    <section id="gamePanel" class="panel game-panel" hidden>
      <div class="status-row">
        <div>
          <span id="gameState">Ready</span>
          <strong id="gameStatus"></strong>
        </div>
      </div>
      <div class="play-layout">
        <div class="side-stack">
          <div class="mini-card"><span>Hold</span><canvas id="holdCanvas" width="96" height="96"></canvas></div>
          <div class="mini-card"><span>Next</span><canvas id="nextCanvas" width="96" height="96"></canvas></div>
          <div id="garbagePanel" class="mini-card garbage-card" hidden><span>Garbage</span><strong id="garbageCount">0</strong></div>
        </div>
        <div class="board-wrap">
          <canvas id="boardCanvas" width="300" height="600" aria-label="Blockfall playfield"></canvas>
          <div id="overlay" class="game-overlay" hidden>
            <strong id="overlayTitle">Paused</strong>
            <span id="overlayText"></span>
            <div class="overlay-actions">
              <button id="resumeGame" type="button" class="primary">Resume</button>
              <button id="playAgain" type="button">Play Again</button>
            </div>
          </div>
        </div>
        <div class="right-rail">
          <div class="hud">
            <div><span>Score</span><strong id="score">0</strong></div>
            <div><span>Lines</span><strong id="lines">0</strong></div>
            <div><span>Level</span><strong id="level">1</strong></div>
            <div><span>Time</span><strong id="timeLeft">--</strong></div>
          </div>
          <div id="opponents" class="opponents"></div>
        </div>
      </div>
      <div class="touch-controls" aria-label="Touch controls">
        <button data-control="hold" type="button" class="control-hold">Hold</button>
        <span class="control-spacer" aria-hidden="true"></span>
        <button data-control="soft" type="button" class="control-soft" aria-label="Soft drop">↓</button>
        <button data-control="left" type="button" class="control-left" aria-label="Move left">←</button>
        <button data-control="right" type="button" class="control-right" aria-label="Move right">→</button>
        <button data-control="rotate" type="button" class="primary control-rotate" aria-label="Rotate">↻</button>
        <button data-control="hard" type="button" class="gold control-hard" aria-label="Hard drop">↓↓</button>
      </div>
      <div class="actions">
        <button id="leaveGame" class="small-pill" type="button">Leave</button>
        <button id="closeGame" type="button" class="danger">Close Game</button>
        <button data-control="pause" type="button">Pause</button>
      </div>
    </section>

    <p id="message" class="message" role="status"></p>
  </main>
  <script src="blockfall.js"></script>
</body>
</html>
